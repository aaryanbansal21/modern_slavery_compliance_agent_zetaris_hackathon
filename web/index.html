<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reasonable Steps</title>
  <meta name="description" content="Supplier due diligence and evidence-backed answers to modern slavery questionnaires, for small suppliers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231E2B3A'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='%23EEF2EC' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">Reasonable Steps</div>
        <div class="brand-sub" id="brand-sub">Modern slavery due diligence for suppliers</div>
      </div>
    </div>
    <div class="stack-status" id="stack-status" aria-label="Connected systems"></div>
    <div class="run-area">
      <span class="run-state" id="run-state" role="status" aria-live="polite"></span>
      <button class="btn btn-primary" id="run-btn" type="button">Check suppliers and draft answers</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Views">
    <button type="button" class="tab" data-view="answers" aria-current="page">Answers</button>
    <button type="button" class="tab" data-view="suppliers">Suppliers</button>
    <button type="button" class="tab" data-view="needs">Needs you <span class="count" id="needs-count" hidden></span></button>
    <button type="button" class="tab" data-view="trace">Agent trace</button>
    <button type="button" class="tab" data-view="world">World Model</button>
    <button type="button" class="tab" data-view="sources">Data and AI</button>
  </nav>

  <main id="main" tabindex="-1">
    <section class="view" id="view-answers" aria-label="Answers"></section>
    <section class="view" id="view-suppliers" aria-label="Suppliers" hidden></section>
    <section class="view" id="view-needs" aria-label="Needs you" hidden></section>
    <section class="view" id="view-trace" aria-label="Agent trace" hidden></section>
    <section class="view" id="view-world" aria-label="World Model" hidden></section>
    <section class="view" id="view-sources" aria-label="Data and AI" hidden></section>
  </main>

  <aside class="drawer" id="drawer" aria-label="Evidence" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title">Evidence</h2>
      <button class="btn btn-ghost" type="button" id="drawer-close">Close</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
